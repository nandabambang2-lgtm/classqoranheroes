        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* Hilangkan scrollbar default untuk tampilan yang lebih bersih di HP */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;

    <!-- Firebase SDK v11.6.1 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Menyimpan fungsi Firebase di window agar bisa diakses oleh Babel React
        window.FirebaseBridge = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, doc, getDoc, setDoc, onSnapshot
        };
    </script>
</head>

        const initialActivities = [

        function App() {
          const [dbReady, setDbReady] = useState(false);
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [userRole, setUserRole] = useState(null); 
          const [userName, setUserName] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
          const [isRegisterMode, setIsRegisterMode] = useState(false);
          
          // Data Utama
          const [students, setStudents] = useState([]);
          const [transactions, setTransactions] = useState([]);
          const [feedbacks, setFeedbacks] = useState([]);
          const [activities, setActivities] = useState([]);
          const [musyrifPhoto, setMusyrifPhoto] = useState(''); // Foto Profil Musyrif
          const [musyrifName, setMusyrifName] = useState('Kak Nanda (Musyrif)'); // Nama Profil Musyrif

          // Absensi Berbasis Tanggal & Alasan
          const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
          const [attendanceRecords, setAttendanceRecords] = useState({});

          // Form Kegiatan Baru
          const [newActivityTitle, setNewActivityTitle] = useState('');
          const [newActivityDesc, setNewActivityDesc] = useState('');
          const [newActivityImage, setNewActivityImage] = useState('');

          // Form Ubah Nama Lengkap
          const [editProfileName, setEditProfileName] = useState('');

          // Motivasi AI
          const [motivation, setMotivation] = useState({
            quote: "Sebaik-baik kalian adalah orang yang belajar Al-Qur'an dan mengajarkannya.",
            source: "Hadis Riwayat Al-Bukhari"
          });
          const [loadingMotivation, setLoadingMotivation] = useState(false);

          // Feedback Form
          const [fbRating, setFbRating] = useState(5);
          const [fbComment, setFbComment] = useState('');
          const [fbIsAnonymous, setFbIsAnonymous] = useState(false);
          const [hoveredStar, setHoveredStar] = useState(0);

          // Notifikasi & Modals
          const [notification, setNotification] = useState({ show: false, message: '', type: 'success' });
          const [modalConfirm, setModalConfirm] = useState({ show: false, title: '', message: '', onConfirm: null });
          const [modalResetPass, setModalResetPass] = useState({ show: false, targetStudent: null, newPassword: '' });

          // Profil Saya
          const [profileOldPass, setProfileOldPass] = useState('');
          const [profileNewPass, setProfileNewPass] = useState('');
          const [profileConfirmPass, setProfileConfirmPass] = useState('');

          // Sub-Tabs
          const [jurnalSubTab, setJurnalSubTab] = useState('quran'); 
          const [kasSubTab, setKasSubTab] = useState('riwayat'); 

          // ===== QUIZ GAME STATE =====
          const [quizState, setQuizState] = useState('idle'); // idle | loading | playing | result
          const [quizQuestions, setQuizQuestions] = useState([]);
          const [quizCurrentIndex, setQuizCurrentIndex] = useState(0);
          const [quizSelectedAnswer, setQuizSelectedAnswer] = useState(null);
          const [quizShowAnswer, setQuizShowAnswer] = useState(false);
          const [quizScore, setQuizScore] = useState(0);
          const [quizAnswers, setQuizAnswers] = useState([]); // {correct: bool, selected: str, correct_answer: str}
          const [quizCategory, setQuizCategory] = useState('tajwid');
          const [quizDifficulty, setQuizDifficulty] = useState('mudah');
          const [quizTimer, setQuizTimer] = useState(20);
          const quizTimerRef = useRef(null);

          // ===== KEBUN QURAN FARM GAME STATE =====
          const SURAH_LIST = [
            { id: 1, name: 'Al-Fatihah', ayat: 7, juz: 1 },
            { id: 2, name: 'Al-Ikhlas', ayat: 4, juz: 30 },
            { id: 3, name: 'Al-Falaq', ayat: 5, juz: 30 },
            { id: 4, name: 'An-Nas', ayat: 6, juz: 30 },
            { id: 5, name: 'Al-Kautsar', ayat: 3, juz: 30 },
            { id: 6, name: 'Al-Asr', ayat: 3, juz: 30 },
            { id: 7, name: "Al-Ma'un", ayat: 7, juz: 30 },
            { id: 8, name: 'Al-Kafirun', ayat: 6, juz: 30 },
            { id: 9, name: 'An-Nasr', ayat: 3, juz: 30 },
            { id: 10, name: 'Al-Masad', ayat: 5, juz: 30 },
            { id: 11, name: 'Al-Fil', ayat: 5, juz: 30 },
            { id: 12, name: 'Quraisy', ayat: 4, juz: 30 },
            { id: 13, name: 'Al-Humazah', ayat: 9, juz: 30 },
            { id: 14, name: 'At-Takasur', ayat: 8, juz: 30 },
            { id: 15, name: "Al-Qari'ah", ayat: 11, juz: 30 },
            { id: 16, name: 'Al-Adiyat', ayat: 11, juz: 30 },
            { id: 17, name: 'Az-Zalzalah', ayat: 8, juz: 30 },
            { id: 18, name: 'Al-Bayyinah', ayat: 8, juz: 30 },
            { id: 19, name: "Al-Qadr", ayat: 5, juz: 30 },
            { id: 20, name: 'Al-Alaq', ayat: 19, juz: 30 },
          ];

          const PLANT_STAGES = ['🌱', '🌿', '🌾', '🌻', '✨'];
          // Stage: 0=seed, 1=sprout, 2=sapling, 3=mature, 4=harvest

          const createEmptyPlot = (id) => ({ id, planted: false, surahId: null, stage: 0, murajaahCount: 0, lastMurajaah: null, harvestable: false });
          const GRID_SIZE = 9;
          const [farmPlots, setFarmPlots] = useState(() => Array.from({ length: GRID_SIZE }, (_, i) => createEmptyPlot(i)));
          const [farmCoins, setFarmCoins] = useState(10);
          const [farmXp, setFarmXp] = useState(0);
          const [farmLevel, setFarmLevel] = useState(1);
          const [farmSelectedSurah, setFarmSelectedSurah] = useState(null);
          const [farmSelectedPlot, setFarmSelectedPlot] = useState(null); // plot id
          const [farmModal, setFarmModal] = useState(null); // null | 'plant' | 'murajaah' | 'harvest'
          const [farmMurajaahState, setFarmMurajaahState] = useState('idle'); // idle | loading | verifying | done
          const [farmMurajaahQ, setFarmMurajaahQ] = useState(null);
          const [farmMurajaahAnswer, setFarmMurajaahAnswer] = useState('');
          const [farmMurajaahResult, setFarmMurajaahResult] = useState(null);
          const [farmLog, setFarmLog] = useState([]);

          const farmAddLog = (msg) => setFarmLog(prev => [{ msg, ts: Date.now() }, ...prev].slice(0, 5));

          const farmXpToNextLevel = (lvl) => lvl * 50;

          const farmGetSurahById = (id) => SURAH_LIST.find(s => s.id === id);

          const farmPlant = () => {
            if (!farmSelectedSurah || farmSelectedPlot === null) return;
            if (farmCoins < 2) { showNotification('Koin tidak cukup! Panen dulu untuk dapat koin.', 'error'); return; }
            const surah = farmGetSurahById(farmSelectedSurah);
            setFarmPlots(prev => prev.map(p => p.id === farmSelectedPlot ? { ...p, planted: true, surahId: farmSelectedSurah, stage: 0, murajaahCount: 0, harvestable: false } : p));
            setFarmCoins(c => c - 2);
            farmAddLog(`🌱 Menanam ${surah.name} di petak ${farmSelectedPlot + 1}`);
            setFarmModal(null);
            setFarmSelectedPlot(null);
          };

          const farmStartMurajaah = async (plot) => {
            setFarmModal('murajaah');
            setFarmSelectedPlot(plot.id);
            setFarmMurajaahState('loading');
            setFarmMurajaahAnswer('');
            setFarmMurajaahResult(null);
            const surah = farmGetSurahById(plot.surahId);
            try {
              const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  model: 'claude-sonnet-4-20250514',
                  max_tokens: 400,
                  messages: [{
                    role: 'user',
                    content: `Buat 1 soal murajaah (hafalan) tentang Surah ${surah.name} yang berisi ${surah.ayat} ayat. 
Soal harus berupa melanjutkan ayat atau pertanyaan tentang isi surah tersebut.
Jawab HANYA dalam format JSON persis seperti ini (tanpa teks lain):
{"question":"...teks soal...", "answer":"...jawaban singkat...","hint":"...petunjuk..."}
Gunakan bahasa Indonesia. Soal yang bervariasi setiap kali.`
                  }]
                })
              });
              const data = await res.json();
              const txt = data.content?.map(c => c.text || '').join('');
              const clean = txt.replace(/```json|```/g, '').trim();
              const parsed = JSON.parse(clean);
              setFarmMurajaahQ(parsed);
              setFarmMurajaahState('verifying');
            } catch (e) {
              const surahQuestions = {
                1: { question: 'Sebutkan jumlah ayat dalam Surah Al-Fatihah!', answer: '7', hint: 'Surah pembuka Al-Quran' },
                2: { question: 'Apa arti kata "Al-Ikhlas"?', answer: 'Kemurnian/Keikhlasan', hint: 'Nama surah ke-112' },
                3: { question: 'Dari apakah kita berlindung dalam Surah Al-Falaq?', answer: 'Kejahatan makhluk, kegelapan, dan orang-orang yang dengki', hint: 'Surah ke-113' },
              };
              const fallback = surahQuestions[plot.surahId] || { question: `Sebutkan jumlah ayat Surah ${surah.name}!`, answer: String(surah.ayat), hint: `Surah ini ada di Juz ${surah.juz}` };
              setFarmMurajaahQ(fallback);
              setFarmMurajaahState('verifying');
            }
          };

          const farmSubmitMurajaah = async () => {
            if (!farmMurajaahAnswer.trim()) return;
            setFarmMurajaahState('loading');
            const plot = farmPlots.find(p => p.id === farmSelectedPlot);
            const surah = farmGetSurahById(plot.surahId);
            try {
              const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  model: 'claude-sonnet-4-20250514',
                  max_tokens: 150,
                  messages: [{
                    role: 'user',
                    content: `Soal: "${farmMurajaahQ.question}"
Jawaban yang diharapkan: "${farmMurajaahQ.answer}"
Jawaban santri: "${farmMurajaahAnswer}"

Apakah jawaban santri benar atau mendekati benar? Jawab HANYA JSON: {"correct":true/false,"feedback":"...komentar singkat motivasi dalam 1 kalimat bahasa Indonesia..."}`
                  }]
                })
              });
              const data = await res.json();
              const txt = data.content?.map(c => c.text || '').join('');
              const clean = txt.replace(/```json|```/g, '').trim();
              const result = JSON.parse(clean);
              farmApplyMurajaahResult(result.correct, result.feedback);
            } catch (e) {
              const userAns = farmMurajaahAnswer.trim().toLowerCase();
              const correctAns = farmMurajaahQ.answer.toLowerCase();
              const isCorrect = userAns.includes(correctAns) || correctAns.includes(userAns) || (userAns.length > 2 && correctAns.includes(userAns.substring(0, 3)));
              farmApplyMurajaahResult(isCorrect, isCorrect ? 'Jawabanmu benar, teruskan hafalan!' : 'Coba ulangi lagi ya, jangan menyerah!');
            }
          };

          const farmApplyMurajaahResult = (isCorrect, feedback) => {
            setFarmMurajaahResult({ correct: isCorrect, feedback });
            if (isCorrect) {
              setFarmPlots(prev => prev.map(p => {
                if (p.id !== farmSelectedPlot) return p;
                const newCount = p.murajaahCount + 1;
                const newStage = Math.min(newCount, 4);
                const harvestable = newStage >= 4;
                return { ...p, murajaahCount: newCount, stage: newStage, harvestable, lastMurajaah: new Date().toISOString() };
              }));
              const xpGain = 10;
              setFarmXp(prev => {
                const newXp = prev + xpGain;
                const needed = farmXpToNextLevel(farmLevel);
                if (newXp >= needed) { setFarmLevel(l => l + 1); farmAddLog(`🎉 Naik level ${farmLevel + 1}!`); return newXp - needed; }
                return newXp;
              });
              const plot = farmPlots.find(p => p.id === farmSelectedPlot);
              const surah = farmGetSurahById(plot?.surahId);
              farmAddLog(`✅ Murajaah ${surah?.name} berhasil! +${xpGain} XP`);
            }
            setFarmMurajaahState('done');
          };

          const farmHarvest = (plot) => {
            const surah = farmGetSurahById(plot.surahId);
            const reward = 5 + plot.murajaahCount;
            setFarmCoins(c => c + reward);
            setFarmPlots(prev => prev.map(p => p.id === plot.id ? createEmptyPlot(p.id) : p));
            farmAddLog(`🌻 Panen ${surah.name}! +${reward} koin`);
            showNotification(`Alhamdulillah! Panen ${surah.name} berhasil! +${reward} koin 🌾`, 'success');
            setFarmModal(null);
          };

          const renderFarm = () => {
            const xpNeeded = farmXpToNextLevel(farmLevel);
            const xpPct = Math.min((farmXp / xpNeeded) * 100, 100);
            const unlockedPlots = Math.min(3 + farmLevel * 2, GRID_SIZE);

            return (
              <div className="space-y-5 fade-in">
                {/* Header */}
                <div className="bg-gradient-to-br from-[#1a5c1a] to-[#2d8a2d] rounded-3xl p-5 text-white shadow-xl">
                  <div className="flex items-center justify-between mb-3">
                    <div>
                      <h2 className="text-xl font-black flex items-center gap-2">🌾 Kebun Qur'an</h2>
                      <p className="text-green-200 text-xs mt-0.5">Tanam Hafalan, Panen Pahala!</p>
                    </div>
                    <div className="text-right">
                      <div className="text-2xl font-black">{farmCoins} 🪙</div>
                      <div className="text-green-200 text-xs">Koin Pahala</div>
                    </div>
                  </div>
                  <div className="flex items-center gap-3 bg-white/10 rounded-2xl p-3">
                    <div className="text-sm font-black">Lv.{farmLevel}</div>
                    <div className="flex-1">
                      <div className="flex justify-between text-[10px] text-green-200 mb-1">
                        <span>XP Hafalan</span><span>{farmXp}/{xpNeeded}</span>
                      </div>
                      <div className="bg-white/20 rounded-full h-2.5 overflow-hidden">
                        <div className="bg-[#F4C542] h-full rounded-full transition-all duration-500" style={{width:`${xpPct}%`}}></div>
                      </div>
                    </div>
                    <div className="text-xs font-bold text-[#F4C542]">⭐ Petani Qur'an</div>
                  </div>
                  {/* Activity log */}
                  {farmLog.length > 0 && (
                    <div className="mt-3 bg-white/10 rounded-xl p-2 text-xs text-green-100 max-h-16 overflow-hidden">
                      {farmLog.slice(0,3).map((l,i) => <div key={l.ts} className={i===0?'font-bold':'opacity-60'}>{l.msg}</div>)}
                    </div>
                  )}
                </div>

                {/* Guide */}
                <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4">
                  <p className="text-xs font-bold text-amber-700 mb-2">📖 Cara Bermain:</p>
                  <div className="grid grid-cols-2 gap-1.5 text-[11px] text-amber-800">

            const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const months = [
              "Januari", "Februari", "Maret", "April", "Mei", "Juni",
              "Juli", "Agustus", "September", "Oktober", "November", "Desember"
            ];
            
            const dayName = days[date.getDay()];
            const dayNum = date.getDate();
            const monthName = months[date.getMonth()];
            const year = date.getFullYear();
            
            return `${dayName}, ${dayNum} ${monthName} ${year}`;

              const systemPrompt = "Bertindak sebagai motivator Islami ulung yang penuh kasih sayang namun bersemangat membara. Buatlah nasihat pendek yang menginspirasi anak-anak santri agar antusias menghafal Al-Qur'an.";

                setMusyrifPhoto('');

                setAttendanceRecords({});

                showNotification('Seluruh database berhasil disetel ulang!', 'success');
                setModalConfirm({ show: false, title: '', message: '', onConfirm: null });
              }
            });
          };

          const handleUserChangePassword = async (e) => {
            e.preventDefault();
            const currentStudent = students.find(s => s.name.toLowerCase() === userName.toLowerCase());
            if (!currentStudent) return;

            if (profileOldPass !== currentStudent.password) {
              showNotification("Sandi lama tidak sesuai!", "error");
              return;
            }

            if (profileNewPass.length < 4) {
              showNotification("Sandi baru minimal 4 karakter!", "error");
              return;
            }

            if (profileNewPass !== profileConfirmPass) {
              showNotification("Sandi konfirmasi tidak cocok!", "error");
              return;
            }

            const updated = students.map(s => s.id === currentStudent.id ? { ...s, password: profileNewPass } : s);
            setStudents(updated);
            await saveToCloud(updated, transactions);
            showNotification("Kata sandi berhasil diperbarui!", "success");
            setProfileOldPass('');
            setProfileNewPass('');
            setProfileConfirmPass('');
          };

          // Aksi Mengubah Nama (Musyrif & Santri)
          const handleUserChangeName = async (e) => {
            e.preventDefault();
            const cleanNewName = editProfileName.trim();
            
            if (cleanNewName.length < 2) {
              showNotification("Nama minimal terdiri dari 2 karakter!", "error");
              return;
            }

            if (userRole === 'musyrif') {
              if (cleanNewName.toLowerCase() === 'musyrif') {
                showNotification("Nama tidak boleh hanya kata 'musyrif'!", "error");
                return;
              }
              setMusyrifName(cleanNewName);
              setUserName(cleanNewName);
              await saveToCloud(students, transactions, feedbacks, activities, musyrifPhoto, attendanceRecords, cleanNewName);

              setEditProfileName('');
            } else {
              // Jika peran adalah Santri
              const currentStudent = students.find(s => s.name.toLowerCase() === userName.toLowerCase());
              if (!currentStudent) return;

              // Cek jika nama sudah digunakan oleh santri lain atau admin
              const isTaken = students.some(s => s.id !== currentStudent.id && s.name.toLowerCase() === cleanNewName.toLowerCase());
              if (isTaken || cleanNewName.toLowerCase() === 'musyrif' || cleanNewName.toLowerCase() === musyrifName.toLowerCase()) {
                showNotification("Nama ini sudah digunakan atau tidak diperbolehkan!", "error");
                return;
              }

              const updatedStudents = students.map(s => 
                s.id === currentStudent.id ? { ...s, name: cleanNewName } : s
              );
              
              setStudents(updatedStudents);
              setUserName(cleanNewName);
              await saveToCloud(updatedStudents, transactions, feedbacks, activities, musyrifPhoto, attendanceRecords, musyrifName);

              setEditProfileName('');

            const { targetStudent, newPassword } = modalResetPass;
            if (!targetStudent || !newPassword) return;

            const updated = students.map(s => s.id === targetStudent.id ? { ...s, password: newPassword } : s);
            setStudents(updated);
            await saveToCloud(updated, transactions);
            showNotification(`Sandi ${targetStudent.name} disetel ulang menjadi: "${newPassword}"`, "success");

                const rankedStudents = updatedStudents.map(s => ({
                  ...s,
                  rank: sortedByScore.findIndex(x => x.id === s.id) + 1

                setStudents(rankedStudents);
                await saveToCloud(rankedStudents, transactions, feedbacks, activities, musyrifPhoto, attendanceRecords);

                                onChange={(e) => handleGradeChange(student.id, subject, e.target.value)}
                                className="w-full text-center text-xs font-bold border border-gray-300 rounded-lg py-1 bg-white min-h-[34px]"
                              />
                            ) : (
                              <span className="font-bold text-gray-700 text-sm">{student.grades?.[subject] ?? 0}</span>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>

                {/* Desktop Table View */}
                <div className="hidden md:block bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                  <div className="bg-gradient-to-r from-[#0A2A66] to-[#124094] p-6 text-white flex justify-between items-center">
                     <div>
                       <h3 className="text-xl font-bold flex items-center">
                         <i className="fa-solid fa-chart-line mr-3 text-[#F4C542]"></i> Nilai Pembelajaran Diniyah
                       </h3>
                       <p className="text-blue-200 text-sm mt-1 font-light">Detail nilai pelajaran Tajwid, At-Tibyan, dan Bahasa Arab.</p>
                     </div>
                      {userRole === 'musyrif' && (
                      <span className="bg-[#2EA8FF] text-white text-xs px-3 py-1 rounded-full font-bold tracking-wide">
                        MODE EDIT NILAI
                      </span>
                    )}
                  </div>
                  
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse min-w-[700px]">
                      <thead>
                        <tr className="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-200">
                          <th className="py-4 px-6 font-bold w-16 text-center">Rank</th>
                          <th className="py-4 px-6 font-bold">Nama</th>
                          <th className="py-4 px-4 font-bold text-center border-l">Tajwid</th>
                          <th className="py-4 px-4 font-bold text-center border-l">At-Tibyan</th>
                          <th className="py-4 px-4 font-bold text-center border-l">B. Arab</th>
                          <th className="py-4 px-6 font-bold text-right border-l text-[#0A2A66]">Rata-rata</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {sortedStudents.map((student) => (
                          <tr key={student.id} className="hover:bg-blue-50/50 transition-colors">
                            <td className="py-4 px-6 text-center">
                              <span className={`inline-flex items-center justify-center w-8 h-8 rounded-full font-bold text-sm ${
                                student.rank === 1 ? 'bg-yellow-100 text-yellow-700' :
                                student.rank === 2 ? 'bg-gray-100 text-gray-700' :
                                student.rank === 3 ? 'bg-orange-100 text-orange-700' : 'text-gray-400'
                              }`}>
                                {student.rank}
                              </span>
                            </td>
                            <td className="py-4 px-6 font-bold text-[#0A2A66]">
                              <div className="flex items-center gap-2">
                                <div className="w-8 h-8 rounded-full overflow-hidden shadow-inner">
                                  {getAvatar(student.name)}
                                </div>
                                {student.name}
                              </div>
                            </td>
                            
                            {['tajwid', 'tibyan', 'arab'].map(subject => (
                              <td key={subject} className="py-4 px-4 text-center border-l border-gray-50">
                                {userRole === 'musyrif' ? (
                                  <input
                                    type="number" min="0" max="100"
                                    value={student.grades?.[subject] ?? 0}
                                    onChange={(e) => handleGradeChange(student.id, subject, e.target.value)}
                                    className="w-14 text-center text-sm border border-gray-300 rounded-md py-1"
                                  />
                                ) : (
                                  <span className="font-medium text-gray-700">{student.grades?.[subject] ?? 0}</span>
                                )}
                              </td>
                            ))}

                            <td className="py-4 px-6 text-right border-l border-gray-50">
                              <span className="font-black text-lg text-[#0A2A66]">{student.score}</span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            );
          };

          const renderKas = () => {
            const loggedInStudent = students.find(s => s.name.toLowerCase() === userName.toLowerCase());
            const isAuthorizedForKas = userRole === 'musyrif' || (loggedInStudent && loggedInStudent.role === 'Bendahara');

            const totalIncome = transactions.filter(t => t.type === 'pemasukan').reduce((acc, curr) => acc + curr.amount, 0);
            const totalExpense = transactions.filter(t => t.type === 'pengeluaran').reduce((acc, curr) => acc + curr.amount, 0);
            const currentBalance = totalIncome - totalExpense;

            const formatRupiah = (number) => {
              return 'Rp ' + number.toLocaleString('id-ID');
            };

            const standardFee = 10000;

            const handleAddTransaction = async (e) => {
              e.preventDefault();
              if (!txAmount || !txDesc || !txDate) {
                showNotification('Harap isi semua kolom transaksi!', 'error');
                return;
              }
              const newTx = {
                id: Date.now(),
                date: txDate,
                description: txDesc,
                type: txType,
                amount: parseInt(txAmount, 10)
              };

              const updatedTransactions = [newTx, ...transactions];
              setTransactions(updatedTransactions);
              await saveToCloud(students, updatedTransactions);

              setTxAmount('');
              setTxDesc('');
              showNotification('Transaksi kas baru berhasil dicatat!', 'success');
            };

            const handleDeleteTransaction = async (id) => {
              const updatedTransactions = transactions.filter(t => t.id !== id);
              setTransactions(updatedTransactions);
              await saveToCloud(students, updatedTransactions);
              showNotification('Transaksi kas berhasil dihapus.', 'success');
            };

            const handleToggleKasPaid = async (studentId) => {
              if (!isAuthorizedForKas) {
                showNotification("Akses ditolak. Hanya Musyrif atau Bendahara.", "error");
                return;
              }

              const student = students.find(s => s.id === studentId);
              if (!student) return;

              const isNowPaid = !student.kasPaid;
              const todayDate = new Date().toISOString().split('T')[0];
              const descCheck = `Uang Kas Mingguan ${student.name}`;

              let updatedTransactions = [...transactions];

              if (isNowPaid) {
                const automaticTx = {
                  id: Date.now(),
                  date: todayDate,
                  description: descCheck,
                  type: 'pemasukan',
                  amount: standardFee
                };
                updatedTransactions = [automaticTx, ...updatedTransactions];
                showNotification(`Iuran ${student.name} ditandai LUNAS.`, 'success');
              } else {
                updatedTransactions = updatedTransactions.filter(t => 
                  !(t.type === 'pemasukan' && t.description.includes(descCheck))
                );
                showNotification(`Iuran ${student.name} ditandai BELUM BAYAR.`, 'info');
              }

              const updatedStudents = students.map(s => 
                s.id === studentId ? { ...s, kasPaid: isNowPaid } : s
              );

              setStudents(updatedStudents);
              setTransactions(updatedTransactions);
              await saveToCloud(updatedStudents, updatedTransactions);
            };

            const handleResetAllDues = () => {
              setModalConfirm({
                show: true,
                title: "Reset Semua Iuran Santri",
                message: "Apakah Anda yakin ingin mengatur ulang status pembayaran iuran seluruh santri kembali ke 'Belum Bayar' untuk minggu baru?",
                onConfirm: async () => {
                  const updatedStudents = students.map(s => ({ ...s, kasPaid: false }));
                  setStudents(updatedStudents);
                  await saveToCloud(updatedStudents, transactions);
                  showNotification('Seluruh status iuran berhasil di-reset!', 'success');
                  setModalConfirm({ show: false, title: '', message: '', onConfirm: null });
                }
              });
            };

            return (
              <div className="space-y-6 slide-up">
                {/* Summary Cards */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-gradient-to-br from-[#0A2A66] to-[#124094] text-white rounded-3xl p-5 shadow-md border border-white/10 flex flex-col justify-between">
                    <div>
                      <p className="text-xs font-medium text-blue-200 uppercase tracking-wider">Sisa Saldo Kas</p>
                      <h3 className="text-2xl md:text-3xl font-black mt-1">{formatRupiah(currentBalance)}</h3>
                    </div>
                    <div className="mt-3 flex items-center gap-1.5 text-xs text-blue-200">
                      <i className="fa-solid fa-wallet text-base text-[#F4C542]"></i>
                      <span>Keuangan Kelas Aktif</span>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex items-center gap-4">
                    <div className="p-3 rounded-2xl bg-emerald-100 text-emerald-600 flex-shrink-0">
                      <i className="fa-solid fa-circle-arrow-down text-xl"></i>
                    </div>
                    <div>
                      <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Total Pemasukan</p>
                      <p className="text-xl font-black text-emerald-600">{formatRupiah(totalIncome)}</p>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex items-center gap-4">
                    <div className="p-3 rounded-2xl bg-red-100 text-red-600 flex-shrink-0">
                      <i className="fa-solid fa-circle-arrow-up text-xl"></i>
                    </div>
                    <div>
                      <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Total Pengeluaran</p>
                      <p className="text-xl font-black text-red-500">{formatRupiah(totalExpense)}</p>
                    </div>
                  </div>
                </div>

                {/* Sub-Tabs */}
                <div className="flex gap-1 border-b border-gray-200 mt-4 overflow-x-auto">
                  <button 
                    onClick={() => setKasSubTab('riwayat')}
                    className={`py-3 px-4 md:px-6 font-bold text-xs md:text-sm border-b-2 transition-all flex-1 text-center whitespace-nowrap ${
                      kasSubTab === 'riwayat' ? 'border-[#0A2A66] text-[#0A2A66]' : 'border-transparent text-gray-400 hover:text-gray-600'
                    }`}
                  >
                    <i className="fa-solid fa-receipt mr-1 md:mr-2"></i> Riwayat Transaksi
                  </button>
                  <button 
                    onClick={() => setKasSubTab('iuran')}
                    className={`py-3 px-4 md:px-6 font-bold text-xs md:text-sm border-b-2 transition-all flex-1 text-center whitespace-nowrap ${
                      kasSubTab === 'iuran' ? 'border-[#0A2A66] text-[#0A2A66]' : 'border-transparent text-gray-400 hover:text-gray-600'
                    }`}
                  >
                    <i className="fa-solid fa-list-check mr-1 md:mr-2"></i> Checklist Kas Santri
                  </button>
                </div>

                {kasSubTab === 'riwayat' ? (
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Add Tx Form */}
                    <div className="lg:col-span-1">
                      <div className="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-gray-100 h-full">
                        <h3 className="text-base md:text-lg font-bold text-[#0A2A66] mb-4 flex items-center gap-2">
                          <i className="fa-solid fa-file-invoice-dollar text-[#F4C542]"></i> Catat Manual
                        </h3>

                        {isAuthorizedForKas ? (
                          <form onSubmit={handleAddTransaction} className="space-y-4">
                            <div>
                              <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Tipe Transaksi</label>
                              <div className="grid grid-cols-2 gap-2">
                                <button
                                  type="button"
                                  onClick={() => setTxType('pemasukan')}
                                  className={`py-3 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 border transition-all min-h-[44px] ${
                                    txType === 'pemasukan'
                                      ? 'bg-emerald-500 text-white border-emerald-500 shadow'
                                      : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'
                                  }`}
                                >
                                  <i className="fa-solid fa-arrow-down"></i> Masuk
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setTxType('pengeluaran')}
                                  className={`py-3 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 border transition-all min-h-[44px] ${
                                    txType === 'pengeluaran'
                                      ? 'bg-red-500 text-white border-red-500 shadow'
                                      : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'
                                  }`}
                                >
                                  <i className="fa-solid fa-arrow-up"></i> Keluar
                                </button>
                              </div>
                            </div>

                            <div>
                              <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Jumlah Uang (Rp)</label>
                              <input
                                type="number" required placeholder="Contoh: 10000"
                                value={txAmount}
                                onChange={(e) => setTxAmount(e.target.value)}
                                className="w-full p-3 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#2EA8FF] focus:outline-none min-h-[44px]"
                              />
                            </div>

                            <div>
                              <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Keterangan</label>
                              <input
                                type="text" required placeholder="Tujuan / Sumber..."
                                value={txDesc}
                                onChange={(e) => setTxDesc(e.target.value)}
                                className="w-full p-3 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#2EA8FF] focus:outline-none min-h-[44px]"
                              />
                            </div>

                            <div>
                              <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Tanggal</label>
                              <input
                                type="date" required value={txDate}
                                onChange={(e) => setTxDate(e.target.value)}
                                className="w-full p-3 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#2EA8FF] focus:outline-none min-h-[44px]"
                              />
                            </div>

                            <button
                              type="submit"
                              className="w-full bg-[#0A2A66] hover:bg-[#124094] text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md mt-2 flex items-center justify-center gap-2 text-sm min-h-[44px]"
                            >
                              <i className="fa-solid fa-plus text-[#F4C542]"></i> Simpan Transaksi
                            </button>
                          </form>
                        ) : (
                          <div className="bg-blue-50 border border-blue-100 rounded-2xl p-4 text-center">
                            <i className="fa-solid fa-lock text-[#0A2A66] text-2xl mb-2"></i>
                            <p className="text-sm font-bold text-[#0A2A66]">Akses Terkunci</p>
                            <p className="text-xs text-gray-500 mt-1.5 leading-relaxed font-medium">
                              Pengisian kas manual hanya diperbolehkan untuk **Musyrif** atau **Bendahara Kelas (Una)**.
                            </p>
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Riwayat Table (Responsive Cards on Mobile) */}
                    <div className="lg:col-span-2">
                      <div className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden h-full flex flex-col">
                        <div className="bg-[#0A2A66] p-4 text-white">
                          <h3 className="text-sm md:text-base font-bold flex items-center gap-2">
                            <i className="fa-solid fa-history text-[#F4C542]"></i> Riwayat Transaksi
                          </h3>
                        </div>

                        {/* Mobile View List */}
                        <div className="md:hidden divide-y divide-gray-100 overflow-y-auto max-h-[400px]">
                          {transactions.length === 0 ? (
                            <p className="py-8 text-center text-xs text-gray-400">Belum ada catatan iuran kas.</p>
                          ) : (
                            transactions.map(t => (
                              <div key={t.id} className="p-4 flex items-center justify-between hover:bg-gray-50">
                                <div className="space-y-1 max-w-[70%]">
                                  <p className="font-bold text-gray-800 text-sm">{t.description}</p>
                                  <div className="flex items-center gap-2">
                                    <span className="text-[10px] text-gray-400 font-bold">{t.date}</span>
                                    <span className={`text-[9px] font-black px-1.5 py-0.25 rounded-md ${
                                      t.type === 'pemasukan' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                                    }`}>{t.type === 'pemasukan' ? 'Masuk' : 'Keluar'}</span>
                                  </div>
                                </div>
                                <div className="text-right flex items-center gap-2">
                                  <span className={`font-black text-sm ${t.type === 'pemasukan' ? 'text-emerald-600' : 'text-red-500'}`}>
                                    {t.type === 'pemasukan' ? '+' : '-'} {formatRupiah(t.amount)}
                                  </span>
                                  {isAuthorizedForKas && (
                                    <button
                                      onClick={() => handleDeleteTransaction(t.id)}
                                      className="text-gray-400 hover:text-red-500 p-2 rounded-lg"
                                    >
                                      <i className="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                  )}
                                </div>
                              </div>
                            ))
                          )}
                        </div>

                        {/* Desktop Table */}
                        <div className="hidden md:block overflow-y-auto flex-grow max-h-[420px]">
                          <table className="w-full text-left border-collapse min-w-[500px]">
                            <thead>
                              <tr className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-100">
                                <th className="py-3.5 px-6 font-bold">Tanggal</th>
                                <th className="py-3.5 px-6 font-bold">Keterangan</th>
                                <th className="py-3.5 px-6 font-bold">Tipe</th>
                                <th className="py-3.5 px-6 font-bold text-right">Jumlah</th>
                                {isAuthorizedForKas && <th className="py-3.5 px-6 font-bold text-center w-16">Aksi</th>}
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-50">
                              {transactions.length === 0 ? (
                                <tr>
                                  <td colSpan={isAuthorizedForKas ? 5 : 4} className="py-8 text-center text-sm text-gray-400">
                                    Belum ada catatan keuangan kas.
                                  </td>
                                </tr>
                              ) : (
                                transactions.map(t => (
                                  <tr key={t.id} className="hover:bg-blue-50/20 text-sm transition-colors">
                                    <td className="py-4 px-6 text-gray-500 font-medium">{t.date}</td>
                                    <td className="py-4 px-6 font-bold text-gray-800">{t.description}</td>
                                    <td className="py-4 px-6">
                                      <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold ${
                                        t.type === 'pemasukan' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'
                                      }`}>
                                        {t.type === 'pemasukan' ? 'Masuk' : 'Keluar'}
                                      </span>
                                    </td>
                                    <td className={`py-4 px-6 text-right font-black ${
                                      t.type === 'pemasukan' ? 'text-emerald-600' : 'text-red-500'
                                    }`}>
                                      {t.type === 'pemasukan' ? '+' : '-'} {formatRupiah(t.amount)}
                                    </td>
                                    {isAuthorizedForKas && (
                                      <td className="py-4 px-6 text-center">
                                        <button
                                          onClick={() => handleDeleteTransaction(t.id)}
                                          className="text-gray-400 hover:text-red-500 p-1.5 rounded-lg hover:bg-red-50 transition-colors"
                                        >
                                          <i className="fa-regular fa-trash-can"></i>
                                        </button>
                                      </td>
                                    )}
                                  </tr>
                                ))
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                ) : (
                  /* Status Checklist Iuran (Responsive Cards on Mobile) */
                  <div className="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-gray-100">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-5 pb-3 border-b border-gray-100">
                      <div>
                        <h3 className="text-base md:text-lg font-bold text-[#0A2A66]">Checklist Uang Kas Mingguan</h3>
                        <p className="text-xs text-gray-550 mt-0.5">Biaya kas wajib: <strong>Rp 10.000 / minggu</strong>.</p>
                      </div>
                      {isAuthorizedForKas && (
                        <button
                          onClick={handleResetAllDues}
                          className="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-bold px-4 py-2 rounded-xl transition-all min-h-[38px] w-full sm:w-auto"
                        >
                          Reset Semua Iuran
                        </button>
                      )}
                    </div>

                    {/* Mobile Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:hidden gap-3">
                      {students.map(student => (
                        <div key={student.id} className="p-4 border border-gray-100 rounded-2xl flex items-center justify-between bg-gray-50/50">
                          <div className="flex items-center gap-2.5">
                            <div className="w-8 h-8 rounded-full overflow-hidden">
                              {getAvatar(student.name)}
                            </div>
                            <div>
                              <p className="font-extrabold text-sm text-[#0A2A66]">{student.name}</p>
                              <p className="text-[9px] font-bold text-gray-400 uppercase">{student.role}</p>
                            </div>
                          </div>
                          
                          <div>
                            {isAuthorizedForKas ? (
                              <button
                                onClick={() => handleToggleKasPaid(student.id)}
                                className={`px-4 py-2 rounded-xl font-bold text-[10px] border shadow-sm transition-all min-h-[38px] ${
                                  student.kasPaid 
                                    ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
                                    : 'bg-red-50 text-red-800 border-red-200'
                                }`}
                              >
                                {student.kasPaid ? 'Lunas' : 'Bayar'}
                              </button>
                            ) : (
                              <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${
                                student.kasPaid ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-750'
                              }`}>
                                {student.kasPaid ? 'Lunas' : 'Belum'}
                              </span>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Desktop Table */}
                    <div className="hidden md:block overflow-x-auto">
                      <table className="w-full text-left border-collapse min-w-[500px]">
                        <thead>
                          <tr className="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-150">
                            <th className="py-3 px-4 font-bold">Nama Santri</th>
                            <th className="py-3 px-4 font-bold">Jabatan</th>
                            <th className="py-3 px-4 text-center">Status Pembayaran</th>
                            <th className="py-3 px-4 text-right">Nominal Kas</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                          {students.map(student => (
                            <tr key={student.id} className="hover:bg-blue-50/25 text-sm transition-colors">
                              <td className="py-4 px-4 font-bold text-gray-800 flex items-center gap-2">
                                <div className="w-7 h-7 rounded-full overflow-hidden shadow-inner">
                                  {getAvatar(student.name)}
                                </div>
                                {student.name}
                              </td>
                              <td className="py-4 px-4">
                                <span className="text-xs font-semibold text-gray-500 bg-gray-100 px-2 py-1 rounded-full">{student.role}</span>
                              </td>
                              <td className="py-4 px-4 text-center">
                                {isAuthorizedForKas ? (
                                  <button
                                    onClick={() => handleToggleKasPaid(student.id)}

          const startQuizTimer = () => {

            quizTimerRef.current = setInterval(() => {
              setQuizTimer(prev => {
                if (prev <= 1) {
                  clearInterval(quizTimerRef.current);
                  // Auto-select wrong when time runs out
                  setQuizShowAnswer(true);
                  setQuizAnswers(ans => [...ans, { correct: false, timeout: true }]);
                  return 0;
                }
                return prev - 1;
              });
            }, 1000);
          };

          const fetchQuizQuestions = async () => {
            setQuizState('loading');
            const categoryLabels = {
              tajwid: 'Ilmu Tajwid (hukum bacaan Al-Quran seperti Mad, Nun Sukun, dll)',
              quran: 'Pengetahuan Al-Quran (nama surah, jumlah ayat, urutan juz, dll)',
              hadis: 'Hadis Nabi (Arbain Nawawi, hadis terkenal, perawi, dll)',
              fiqih: 'Fiqih Ibadah dasar (sholat, wudhu, puasa, dll)',
              siroh: 'Siroh Nabawiyah (sejarah Nabi Muhammad SAW)',
            };
            const difficultyMap = { mudah: 'sangat mudah untuk santri SD kelas 4-6', sedang: 'sedang untuk santri SMP', sulit: 'menantang untuk santri SMA/dewasa' };
            const prompt = `Buat 5 soal pilihan ganda tentang ${categoryLabels[quizCategory]} dengan tingkat kesulitan ${difficultyMap[quizDifficulty]}. Setiap soal harus unik dan berbeda. Format respons HANYA JSON array seperti ini tanpa backtick apapun:
[
  {
    "question": "teks soal",
    "options": ["A. ...", "B. ...", "C. ...", "D. ..."],
    "answer": "A. ...",
    "explanation": "Penjelasan singkat mengapa jawaban ini benar (1-2 kalimat)"
  }
]
Pastikan "answer" persis sama dengan salah satu item di "options". Buat soal yang menarik dan edukatif untuk anak-anak ngaji.`;

            try {
              const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  model: "claude-sonnet-4-20250514",
                  max_tokens: 1000,
                  messages: [{ role: "user", content: prompt }]
                })
              });
              const data = await response.json();
              const text = data.content?.map(i => i.text || '').join('');
              const clean = text.replace(/```json|```/g, '').trim();
              const questions = JSON.parse(clean);
              setQuizQuestions(questions);
              setQuizCurrentIndex(0);
              setQuizScore(0);
              setQuizAnswers([]);
              setQuizSelectedAnswer(null);
              setQuizShowAnswer(false);
              setQuizState('playing');
              setTimeout(() => startQuizTimer(), 100);
            } catch (err) {
              console.error('Quiz API error:', err);
              // Fallback soal hardcoded
              const fallback = [
                { question: "Berapa jumlah juz dalam Al-Quran?", options: ["A. 20", "B. 25", "C. 30", "D. 114"], answer: "C. 30", explanation: "Al-Quran terbagi menjadi 30 juz untuk memudahkan penghafalan." },
                { question: "Surah apakah yang disebut 'Jantung Al-Quran'?", options: ["A. Al-Fatihah", "B. Yasin", "C. Al-Baqarah", "D. Al-Ikhlas"], answer: "B. Yasin", explanation: "Rasulullah SAW bersabda bahwa Yasin adalah jantung Al-Quran (HR. Ahmad)." },
                { question: "Hukum bacaan 'nun mati bertemu ba' adalah?", options: ["A. Izhar", "B. Idgham", "C. Iqlab", "D. Ikhfa"], answer: "C. Iqlab", explanation: "Nun mati/tanwin bertemu huruf Ba' hukumnya Iqlab, dibaca seperti mim." },
                { question: "Arbain Nawawi berisi berapa hadis?", options: ["A. 30", "B. 40", "C. 42", "D. 50"], answer: "C. 42", explanation: "Arbain Nawawi karya Imam Nawawi berisi 42 hadis (bukan 40, ada tambahan dari Ibn Rajab)." },
                { question: "Surah Al-Fatihah terdiri dari berapa ayat?", options: ["A. 5", "B. 6", "C. 7", "D. 8"], answer: "C. 7", explanation: "Al-Fatihah terdiri dari 7 ayat, itulah mengapa disebut As-Sab'ul Matsani (tujuh yang diulang)." },
              ];
              setQuizQuestions(fallback);
              setQuizCurrentIndex(0);
              setQuizScore(0);
              setQuizAnswers([]);
              setQuizSelectedAnswer(null);
              setQuizShowAnswer(false);
              setQuizState('playing');
              setTimeout(() => startQuizTimer(), 100);
              showNotification('Soal cadangan dimuat (offline mode)', 'warning');
            }
          };

          const handleQuizAnswer = (option) => {
            if (quizShowAnswer) return;
            clearInterval(quizTimerRef.current);
            const currentQ = quizQuestions[quizCurrentIndex];
            const isCorrect = option === currentQ.answer;
            setQuizSelectedAnswer(option);
            setQuizShowAnswer(true);
            if (isCorrect) setQuizScore(s => s + 1);
            setQuizAnswers(ans => [...ans, { correct: isCorrect, selected: option, correct_answer: currentQ.answer }]);
          };

          const handleQuizNext = () => {
            const nextIndex = quizCurrentIndex + 1;
            if (nextIndex >= quizQuestions.length) {
              clearInterval(quizTimerRef.current);
              setQuizState('result');
            } else {
              setQuizCurrentIndex(nextIndex);
              setQuizSelectedAnswer(null);
              setQuizShowAnswer(false);
              setQuizTimer(20);
              setTimeout(() => startQuizTimer(), 100);
            }
          };

          const renderQuiz = () => {
            const categoryOptions = [
              { id: 'tajwid', label: 'Tajwid', icon: 'fa-book-open', color: 'from-blue-500 to-blue-700' },
              { id: 'quran', label: 'Al-Quran', icon: 'fa-quran', color: 'from-emerald-500 to-emerald-700' },
              { id: 'hadis', label: 'Hadis', icon: 'fa-scroll', color: 'from-amber-500 to-amber-700' },
              { id: 'fiqih', label: 'Fiqih', icon: 'fa-mosque', color: 'from-purple-500 to-purple-700' },
              { id: 'siroh', label: 'Siroh', icon: 'fa-star-and-crescent', color: 'from-rose-500 to-rose-700' },
            ];
            const diffOptions = [
              { id: 'mudah', label: 'Mudah', emoji: '🌱' },
              { id: 'sedang', label: 'Sedang', emoji: '🔥' },
              { id: 'sulit', label: 'Sulit', emoji: '⚡' },
            ];

            if (quizState === 'idle') {
              return (
                <div className="fade-in space-y-6">
                  <div className="bg-gradient-to-br from-[#0A2A66] to-[#124094] rounded-3xl p-6 md:p-8 text-white text-center shadow-xl">
                    <div className="text-5xl mb-3">🎮</div>
                    <h2 className="text-2xl md:text-3xl font-black mb-2">Quiz Islami</h2>
                    <p className="text-blue-200 text-sm">Uji pengetahuan agamamu! Soal dibuat AI setiap ronde — selalu baru!</p>
                  </div>

                  <div className="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-gray-100">
                    <h3 className="text-sm font-black text-[#0A2A66] uppercase tracking-wider mb-3 flex items-center gap-2">
                      <i className="fa-solid fa-layer-group text-[#2EA8FF]"></i> Pilih Kategori
                    </h3>
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                      {categoryOptions.map(cat => (
                        <button
                          key={cat.id}
                          onClick={() => setQuizCategory(cat.id)}
                          className={`flex flex-col items-center gap-2 p-4 rounded-2xl border-2 transition-all font-bold text-sm ${
                            quizCategory === cat.id
                              ? 'border-[#2EA8FF] bg-blue-50 text-[#0A2A66] shadow-md scale-105'
                              : 'border-gray-200 hover:border-gray-300 text-gray-600'
                          }`}
                        >
                          <i className={`fa-solid ${cat.icon} text-xl ${quizCategory === cat.id ? 'text-[#2EA8FF]' : 'text-gray-400'}`}></i>
                          <span className="text-xs">{cat.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-gray-100">
                    <h3 className="text-sm font-black text-[#0A2A66] uppercase tracking-wider mb-3 flex items-center gap-2">
                      <i className="fa-solid fa-gauge-high text-[#F4C542]"></i> Tingkat Kesulitan
                    </h3>
                    <div className="flex gap-3">
                      {diffOptions.map(d => (
                        <button
                          key={d.id}
                          onClick={() => setQuizDifficulty(d.id)}
                          className={`flex-1 py-3 rounded-2xl border-2 font-bold text-sm transition-all ${
                            quizDifficulty === d.id
                              ? 'border-[#F4C542] bg-yellow-50 text-[#0A2A66] shadow-md'
                              : 'border-gray-200 hover:border-gray-300 text-gray-500'
                          }`}
                        >
                          {d.emoji} {d.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button
                    onClick={fetchQuizQuestions}
                    className="w-full bg-gradient-to-r from-[#0A2A66] to-[#2EA8FF] hover:opacity-90 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-500/30 text-base transition-all active:scale-95 flex items-center justify-center gap-3"
                  >
                    <i className="fa-solid fa-play"></i> Mulai Quiz Sekarang!
                  </button>
                </div>
              );
            }

            if (quizState === 'loading') {
              return (
                <div className="flex flex-col items-center justify-center min-h-[60vh] gap-5 fade-in">
                  <div className="relative">
                    <div className="w-20 h-20 rounded-full border-4 border-[#2EA8FF]/20 border-t-[#2EA8FF] animate-spin"></div>
                    <div className="absolute inset-0 flex items-center justify-center text-2xl">🤖</div>
                  </div>
                  <div className="text-center">
                    <h3 className="text-lg font-black text-[#0A2A66]">AI Sedang Membuat Soal...</h3>
                    <p className="text-gray-500 text-sm mt-1">Soal unik baru sedang disiapkan untukmu</p>
                  </div>
                  <div className="flex gap-1">
                    {[0,1,2].map(i => (
                      <div key={i} className="w-2 h-2 bg-[#2EA8FF] rounded-full animate-bounce" style={{animationDelay: `${i*0.15}s`}}></div>
                    ))}
                  </div>
                </div>
              );
            }

            if (quizState === 'playing' && quizQuestions.length > 0) {
              const q = quizQuestions[quizCurrentIndex];
              const progress = ((quizCurrentIndex) / quizQuestions.length) * 100;
              const timerColor = quizTimer > 10 ? 'text-emerald-600' : quizTimer > 5 ? 'text-amber-500' : 'text-red-600';
              const timerBg = quizTimer > 10 ? 'bg-emerald-500' : quizTimer > 5 ? 'bg-amber-500' : 'bg-red-500';

              return (
                <div className="fade-in space-y-4 max-w-2xl mx-auto">
                  {/* Header bar */}
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-black text-gray-400">SOAL</span>
                      <span className="text-lg font-black text-[#0A2A66]">{quizCurrentIndex + 1}</span>
                      <span className="text-xs text-gray-300">/</span>
                      <span className="text-sm font-bold text-gray-400">{quizQuestions.length}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-xs font-bold text-[#F4C542] bg-yellow-50 px-3 py-1 rounded-full">⭐ {quizScore} poin</span>
                      <div className={`flex items-center gap-1.5 font-black text-lg ${timerColor}`}>
                        <i className="fa-regular fa-clock text-sm"></i>
                        <span>{quizTimer}s</span>
                      </div>
                    </div>
                  </div>

                  {/* Timer bar */}
                  <div className="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                    <div
                      className={`h-full rounded-full transition-all duration-1000 ${timerBg}`}
                      style={{ width: `${(quizTimer / 20) * 100}%` }}
                    ></div>
                  </div>

                  {/* Progress */}
                  <div className="w-full bg-gray-100 rounded-full h-1.5">
                    <div className="h-full bg-[#2EA8FF] rounded-full transition-all" style={{ width: `${progress}%` }}></div>
                  </div>

                  {/* Question card */}
                  <div className="bg-gradient-to-br from-[#0A2A66] to-[#124094] rounded-3xl p-6 text-white shadow-lg">
                    <div className="flex items-start gap-3">
                      <span className="bg-white/10 rounded-xl p-2 mt-0.5 text-lg">❓</span>
                      <p className="text-sm md:text-base font-bold leading-relaxed">{q.question}</p>
                    </div>
                  </div>

                  {/* Options */}
                  <div className="space-y-3">
                    {q.options.map((opt, idx) => {
                      let btnClass = 'bg-white border-gray-200 text-gray-700 hover:border-[#2EA8FF] hover:bg-blue-50';
                      if (quizShowAnswer) {
                        if (opt === q.answer) btnClass = 'bg-emerald-50 border-emerald-400 text-emerald-800 shadow-sm';
                        else if (opt === quizSelectedAnswer) btnClass = 'bg-red-50 border-red-400 text-red-700';
                        else btnClass = 'bg-gray-50 border-gray-200 text-gray-400 opacity-60';
                      } else if (quizSelectedAnswer === opt) {
                        btnClass = 'bg-blue-50 border-[#2EA8FF] text-[#0A2A66]';
                      }
                      return (
                        <button
                          key={idx}
                          onClick={() => handleQuizAnswer(opt)}
                          disabled={quizShowAnswer}
                          className={`w-full text-left p-4 rounded-2xl border-2 font-semibold text-sm transition-all flex items-center gap-3 ${btnClass}`}
                        >
                          <span className="w-6 h-6 rounded-lg bg-gray-100 flex items-center justify-center text-xs font-black shrink-0">
                            {['A','B','C','D'][idx]}
                          </span>
                          <span>{opt.replace(/^[A-D]\.\s?/, '')}</span>
                          {quizShowAnswer && opt === q.answer && <i className="fa-solid fa-circle-check text-emerald-500 ml-auto"></i>}
                          {quizShowAnswer && opt === quizSelectedAnswer && opt !== q.answer && <i className="fa-solid fa-circle-xmark text-red-500 ml-auto"></i>}
                        </button>
                      );
                    })}
                  </div>

                  {/* Explanation & Next */}
                  {quizShowAnswer && (
                    <div className="space-y-3 slide-up">
                      <div className={`p-4 rounded-2xl border text-sm font-semibold leading-relaxed ${quizAnswers[quizAnswers.length-1]?.correct ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}`}>
                        <p className="font-black mb-1">{quizAnswers[quizAnswers.length-1]?.correct ? '✅ Benar!' : quizAnswers[quizAnswers.length-1]?.timeout ? '⏰ Waktu Habis!' : '❌ Salah!'}</p>
                        <p className="text-xs leading-relaxed">{q.explanation}</p>
                      </div>
                      <button
                        onClick={handleQuizNext}
                        className="w-full bg-gradient-to-r from-[#0A2A66] to-[#2EA8FF] text-white font-black py-3.5 rounded-2xl shadow-md transition-all active:scale-95 text-sm flex items-center justify-center gap-2"
                      >
                        {quizCurrentIndex + 1 >= quizQuestions.length ? (
                          <><i className="fa-solid fa-flag-checkered"></i> Lihat Hasil Akhir</>
                        ) : (
                          <><i className="fa-solid fa-arrow-right"></i> Soal Berikutnya</>
                        )}
                      </button>
                    </div>
                  )}
                </div>
              );
            }

            if (quizState === 'result') {
              const total = quizQuestions.length;
              const pct = Math.round((quizScore / total) * 100);
              let grade, gradeColor, gradeEmoji;
              if (pct >= 90) { grade = 'Luar Biasa!'; gradeColor = 'text-emerald-600'; gradeEmoji = '🏆'; }
              else if (pct >= 70) { grade = 'Bagus!'; gradeColor = 'text-blue-600'; gradeEmoji = '⭐'; }
              else if (pct >= 50) { grade = 'Lumayan!'; gradeColor = 'text-amber-600'; gradeEmoji = '🔥'; }
              else { grade = 'Terus Belajar!'; gradeColor = 'text-red-600'; gradeEmoji = '💪'; }

              return (
                <div className="fade-in space-y-5 max-w-lg mx-auto">
                  <div className="bg-gradient-to-br from-[#0A2A66] to-[#124094] rounded-3xl p-8 text-white text-center shadow-xl">
                    <div className="text-6xl mb-4">{gradeEmoji}</div>
                    <h2 className={`text-3xl font-black mb-1 ${gradeColor.replace('text-', 'text-').replace('600', '300')}`}>{grade}</h2>
                    <p className="text-blue-200 text-sm mb-6">Kamu menjawab {quizScore} dari {total} soal dengan benar</p>
                    <div className="bg-white/10 rounded-2xl p-5 backdrop-blur-sm">
                      <div className="text-5xl font-black text-white mb-1">{pct}%</div>
                      <div className="text-blue-200 text-xs font-bold uppercase tracking-wider">Skor Akhir</div>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                    <h3 className="text-sm font-black text-[#0A2A66] mb-4 flex items-center gap-2">
                      <i className="fa-solid fa-list-check text-[#2EA8FF]"></i> Ringkasan Jawaban
                    </h3>
                    <div className="space-y-2">
                      {quizAnswers.map((ans, i) => (
                        <div key={i} className={`flex items-center gap-3 p-3 rounded-xl text-xs font-semibold ${ans.correct ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}`}>
                          <span className="w-5 h-5 rounded-full flex items-center justify-center text-white font-black text-[10px] shrink-0" style={{background: ans.correct ? '#10b981' : '#ef4444'}}>{i+1}</span>
                          <span className="flex-1 truncate">{quizQuestions[i]?.question}</span>
                          <i className={`fa-solid ${ans.correct ? 'fa-check' : 'fa-times'} shrink-0`}></i>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <button
                      onClick={() => { setQuizState('idle'); clearInterval(quizTimerRef.current); }}
                      className="py-3.5 rounded-2xl border-2 border-gray-200 text-gray-600 font-black text-sm hover:bg-gray-50 transition-all"
                    >
                      <i className="fa-solid fa-house mr-2"></i> Menu Quiz
                    </button>
                    <button
                      onClick={fetchQuizQuestions}
                      className="py-3.5 rounded-2xl bg-gradient-to-r from-[#0A2A66] to-[#2EA8FF] text-white font-black text-sm shadow-md transition-all active:scale-95"
                    >
                      <i className="fa-solid fa-rotate-right mr-2"></i> Main Lagi!
                    </button>
                  </div>
                </div>
              );
            }

            return null;
          };

          if (!dbReady) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-[#0A2A66] via-[#103D8E] to-[#2EA8FF] flex items-center justify-center p-4">
                <div className="text-center text-white space-y-4">
                  <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white mx-auto"></div>
                  <h2 className="text-lg font-bold">Menghubungkan ke Cloud...</h2>
                  <p className="text-xs text-blue-200">Sedang sinkronisasi data real-time.</p>
                </div>
              </div>
            );
          }

          if (!isLoggedIn) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-[#0A2A66] via-[#103D8E] to-[#2EA8FF] flex items-center justify-center p-4">
                {notification.show && (
                  <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 z-50 p-4 rounded-2xl shadow-xl flex items-center gap-2 border text-sm font-bold animate-bounce ${
                    notification.type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-red-50 text-red-800 border-red-200'
                  }`}>
                    {notification.message}
                  </div>
                )}

                <div className="bg-white rounded-3xl shadow-2xl overflow-hidden max-w-4xl w-full flex flex-col md:flex-row slide-up">
                  {/* Left Hero Visual */}
                  <div className="md:w-1/2 p-6 md:p-12 flex flex-col items-center justify-center bg-gradient-to-br from-[#0A2A66] to-[#124094] text-white text-center relative overflow-hidden">
                    <div className="relative z-10 flex flex-col items-center">
                       {/* Menampilkan Gambar Logo Dari File Secara Akurat */}
                       <img 
                         src="ChatGPT Image 3 Jun 2026, 09.55.10.png" 
                         alt="Quran Heroes Logo" 
                         className="w-24 h-28 md:w-28 md:h-28 object-contain shadow-lg rounded-2xl border-2 border-[#F4C542] mb-3 bg-white/5 p-1 backdrop-blur-sm"
                         onError={(e) => {
                           e.target.style.display = 'none';
                           document.getElementById('fallback-icon').style.display = 'flex';
                         }}
                       />
                       <div id="fallback-icon" className="hidden bg-white/10 p-5 rounded-full backdrop-blur-sm mb-4 border border-white/20 flex items-center justify-center w-20 h-20">
                         <i className="fa-solid fa-shield-halved text-[#F4C542] text-4xl"></i>
                       </div>
                      <h1 className="text-2xl md:text-4xl font-black mb-1.5 tracking-tight leading-tight">
                        CLASS <span className="text-[#F4C542]">HEROES</span><br/>QURAN
                      </h1>
                      <p className="text-[#2EA8FF] font-bold text-xs mb-3 tracking-wide uppercase">Sistem Manajemen Kelas</p>
                      <p className="italic text-gray-200 text-xs md:text-sm leading-relaxed px-4">
                        "Menjadi Pahlawan Al-Qur'an yang Berilmu, Berakhlak, dan Menginspirasi."
                      </p>
                    </div>
                  </div>

                  {/* Right Login / Register Form */}
                  <div className="md:w-1/2 p-6 md:p-12 flex flex-col justify-center bg-white">
                    {!isRegisterMode ? (
                      <div>
                        <div className="mb-6">
                          <h2 className="text-xl md:text-2xl font-bold text-[#0A2A66] mb-0.5">Ahlan wa Sahlan!</h2>
                          <p className="text-gray-405 text-gray-500 text-xs">Masuk untuk memantau kemajuan belajarmu.</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                          <div>
                            <label className="block text-xs font-semibold text-gray-700 mb-1">Nama Santri / Musyrif</label>
                            <input
                              type="text" required value={loginUsername}
                              onChange={(e) => setLoginUsername(e.target.value)}
                              className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#2EA8FF] outline-none text-sm min-h-[44px]"
                              placeholder="Masukkan nama..."
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                            <input
                              type="password" required value={loginPassword}
                              onChange={(e) => setLoginPassword(e.target.value)}
                              className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#2EA8FF] outline-none text-sm min-h-[44px]"
                              placeholder="••••••••"
                            />
                          </div>

                          {loginError && (
                            <div className="p-3 bg-red-50 text-red-600 border border-red-200 rounded-lg text-xs shake">
                              {loginError}
                            </div>

                          <button
                            type="submit"
                            className="w-full bg-[#0A2A66] hover:bg-[#124094] text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md flex justify-center items-center gap-2 text-sm min-h-[44px]"

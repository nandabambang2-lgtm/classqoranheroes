                          </button>
                        </form>

                        <div className="mt-4 text-center">
                          <p className="text-xs text-gray-600">
                            Santri baru?{' '}
                            <button 
                              onClick={() => { setIsRegisterMode(true); setLoginError(''); }}
                              className="text-[#2EA8FF] font-bold hover:underline"
                            >
                              Daftar Akun Baru
                            </button>
                          </p>
                        </div>
                      </div>
                    ) : (
                      <div className="fade-in">
                        <div className="mb-6">
                          <h2 className="text-xl md:text-2xl font-bold text-[#0A2A66] mb-0.5">Daftar Akun</h2>
                          <p className="text-gray-500 text-xs">Mendaftar secara mandiri ke sistem kelas.</p>
                        </div>

                        <form onSubmit={handleRegister} className="space-y-3">
                          <div>
                            <label className="block text-xs font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                            <input
                              type="text" required value={regName}
                              onChange={(e) => setRegName(e.target.value)}
                              className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#2EA8FF] outline-none text-sm min-h-[44px]"
                              placeholder="Contoh: Ahmad"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-gray-700 mb-1">Buat Password</label>
                            <input
                              type="password" required value={regPassword}
                              onChange={(e) => setRegPassword(e.target.value)}
                              className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#2EA8FF] outline-none text-sm min-h-[44px]"
                              placeholder="Minimal 4 karakter"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-gray-700 mb-1">Konfirmasi Password</label>
                            <input
                              type="password" required value={regConfirmPassword}
                              onChange={(e) => setRegConfirmPassword(e.target.value)}
                              className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#2EA8FF] outline-none text-sm min-h-[44px]"
                              placeholder="Ulangi password..."
                            />
                          </div>

                          {regError && (
                            <div className="p-3 bg-red-50 text-red-600 border border-red-200 rounded-lg text-xs shake">
                              {regError}
                            </div>
                          )}

                          <button
                            type="submit"
                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md text-sm min-h-[44px]"

                            Buat Akun Santri

                        </form>

                        <div className="mt-4 text-center">

                            <button 
                              onClick={() => { setIsRegisterMode(false); setRegError(''); }}
                              className="text-[#0A2A66] font-bold hover:underline"
                            >
                              Kembali ke Login
                            </button>
                          </p>
                        </div>
                      </div>

                    <div className="mt-5 text-center bg-blue-50 p-2.5 rounded-xl border border-blue-100">
                      <p className="text-[9px] text-gray-500 font-bold mb-1">AKSES MASUK DEMO</p>
                      <div className="flex flex-col sm:flex-row justify-center gap-1.5 text-[9px] text-gray-600">
                        <div className="bg-white px-2 py-0.5 rounded shadow-sm">
                          <span className="font-bold text-[#0A2A66]">Musyrif:</span> musyrif / 1234
                        </div>
                        <div className="bg-white px-2 py-0.5 rounded shadow-sm">
                          <span className="font-bold text-[#0A2A66]">Santri:</span> Dinan / santri123
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen flex flex-col md:flex-row">
              {/* Toast Notifikasi */}
              {notification.show && (
                <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 z-50 p-4 rounded-2xl shadow-xl flex items-center gap-2 border text-xs md:text-sm font-bold animate-bounce ${
                  notification.type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-red-50 text-red-800 border-red-200'
                }`}>
                  {notification.message}
                </div>
              )}

              {/* Modal Konfirmasi */}
              {modalConfirm.show && (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                  <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-gray-100 slide-up">
                    <h3 className="text-base md:text-lg font-black text-red-600 mb-3 flex items-center gap-2">
                      <i className="fa-solid fa-triangle-exclamation"></i> {modalConfirm.title}
                    </h3>
                    <p className="text-xs md:text-sm text-gray-650 leading-relaxed font-semibold mb-6">
                      {modalConfirm.message}
                    </p>
                    <div className="flex gap-2.5 justify-end">
                      <button
                        onClick={() => setModalConfirm({ show: false, title: '', message: '', onConfirm: null })}
                        className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-xl text-xs font-bold text-gray-500 min-h-[44px]"
                      >
                        Batal
                      </button>
                      <button
                        onClick={modalConfirm.onConfirm}
                        className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold shadow-md min-h-[44px]"
                      >
                        Ya, Lanjutkan
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Modal Reset Sandi */}
              {modalResetPass.show && (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                  <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-gray-100 slide-up">
                    <h3 className="text-base md:text-lg font-black text-[#0A2A66] mb-3 flex items-center gap-2">
                      <i className="fa-solid fa-key"></i> Atur Sandi Baru ({modalResetPass.targetStudent?.name})
                    </h3>
                    <p className="text-[10px] text-gray-400 mb-4 font-semibold">
                      Kata sandi santri akan digantikan secara langsung di database.
                    </p>
                    <input
                      type="text"
                      className="w-full p-3 mb-6 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#2EA8FF] focus:outline-none min-h-[44px]"
                      value={modalResetPass.newPassword}
                      onChange={(e) => setModalResetPass({ ...modalResetPass, newPassword: e.target.value })}
                      placeholder="Masukkan sandi baru"
                    />
                    <div className="flex gap-3 justify-end">
                      <button
                        onClick={() => setModalResetPass({ show: false, targetStudent: null, newPassword: '' })}
                        className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-xl text-xs font-bold text-gray-500 min-h-[44px]"
                      >
                        Batal
                      </button>
                      <button
                        onClick={confirmAdminResetPassword}
                        className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md min-h-[44px]"
                      >
                        Simpan Sandi
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Header Mobile */}
              <div className="md:hidden bg-[#0A2A66] text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
                <div className="flex items-center gap-2 font-black text-lg">
                  <img 
                    src="ChatGPT Image 3 Jun 2026, 09.55.10.png" 
                    alt="Logo" 
                    className="w-8 h-8 object-contain rounded-lg border border-[#F4C542] bg-white/5"
                    onError={(e) => { e.target.style.display = 'none'; }}
                  />
                  <span>CHQ</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <span className="text-xs text-blue-200 font-bold max-w-[80px] truncate">{userName.split(' ')[0]}</span>
                  <div className="w-8 h-8 rounded-full overflow-hidden shadow-sm border border-[#2EA8FF]">
                    {getAvatar(userName)}
                  </div>
                </div>
              </div>

              {/* Sidebar Panel (Desktop Only) */}
              <nav className="hidden md:flex fixed md:sticky top-0 left-0 h-screen w-64 bg-[#0A2A66] text-white p-6 flex-col z-45 transition-transform duration-300">
                <div className="flex flex-col items-center mb-10 pb-6 border-b border-white/10 mt-4">
                  <img 
                    src="ChatGPT Image 3 Jun 2026, 09.55.10.png" 
                    alt="Quran Heroes Logo" 
                    className="w-16 h-16 object-contain shadow-md rounded-xl border border-[#F4C542] mb-3 bg-white/5"
                    onError={(e) => { e.target.style.display = 'none'; }}
                  />
                  <h1 className="text-lg font-black text-center tracking-tight leading-tight">
                    CLASS <span className="text-[#F4C542]">HEROES</span><br/>QURAN
                  </h1>
                </div>

                <div className="mb-8 p-4 bg-white/5 rounded-2xl flex items-center gap-3 border border-white/10">
                  <div className="w-10 h-10 rounded-full overflow-hidden shadow-inner">
                    {getAvatar(userName)}
                  </div>
                  <div className="overflow-hidden">
                    <p className="text-[10px] text-blue-200 uppercase font-bold">Login sebagai</p>
                    <p className="font-bold truncate text-sm">{userName}</p>
                  </div>
                </div>

                <ul className="space-y-2 flex-grow overflow-y-auto">
                  {[
                    { id: 'dashboard', icon: 'fa-shield-halved', label: 'Dashboard' },
                    { id: 'hafalan', icon: 'fa-book-open-reader', label: 'Hafalan & Hadis' },
                    { id: 'absensi', icon: 'fa-calendar-days', label: 'Kehadiran' },
                    { id: 'kas', icon: 'fa-money-bill-wave', label: 'Kas Kelas' },
                    { id: 'rapor', icon: 'fa-chart-line', label: 'Rapor Kelas' },
                    { id: 'quiz', icon: 'fa-gamepad', label: 'Quiz Game 🎮' },
                    { id: 'farm', icon: 'fa-seedling', label: 'Kebun Qur\'an 🌾' },
                    { id: 'saran', icon: 'fa-comments', label: 'Saran & Rating' },
                    { id: 'profil', icon: 'fa-user-gear', label: 'Profil & Akun' },
                  ].map(item => (
                    <li key={item.id}>
                      <button
                        onClick={() => { setActiveTab(item.id); }}
                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all text-sm ${
                          activeTab === item.id 
                          ? 'bg-[#2EA8FF] text-white shadow-lg shadow-[#2EA8FF]/30 translate-x-1' 
                          : 'text-blue-200 hover:bg-white/10 hover:text-white'
                        }`}
                      >
                        <i className={`fa-solid ${item.icon} w-5`}></i> {item.label}
                      </button>
                    </li>
                  ))}
                </ul>

                <div className="pt-6 border-t border-white/10 mt-auto">
                  <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-red-300 hover:bg-red-500/10 font-bold transition-colors text-sm">
                    <i className="fa-solid fa-right-from-bracket"></i> Keluar
                  </button>
                </div>
              </nav>

              {/* Bottom Navigation ala Aplikasi HP (Mobile Only) */}
              <div className="md:hidden fixed bottom-0 left-0 right-0 bg-[#0A2A66] border-t border-white/10 text-white z-50 flex items-center justify-around py-2 px-2 shadow-2xl">
                {[
                  { id: 'dashboard', icon: 'fa-shield-halved', label: 'Home' },
                  { id: 'hafalan', icon: 'fa-book-open-reader', label: 'Hafalan' },
                  { id: 'absensi', icon: 'fa-calendar-days', label: 'Absen' },
                  { id: 'kas', icon: 'fa-money-bill-wave', label: 'Kas' },
                  { id: 'rapor', icon: 'fa-chart-line', label: 'Rapor' },
                  { id: 'profil', icon: 'fa-user-gear', label: 'Profil' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex flex-col items-center gap-1 flex-1 py-1 transition-all ${
                      activeTab === item.id ? 'text-[#2EA8FF] scale-105' : 'text-blue-200 opacity-60'
                    }`}
                  >
                    <i className={`fa-solid ${item.icon} text-lg`}></i>
                    <span className="text-[9px] font-bold">{item.label}</span>
                  </button>
                ))}
                
                {/* Tambahan Menu Saran di pojok kanan bottom-nav */}
                <button
                  onClick={() => setActiveTab('saran')}
                  className={`flex flex-col items-center gap-1 flex-1 py-1 transition-all ${
                    activeTab === 'saran' ? 'text-[#2EA8FF] scale-105' : 'text-blue-200 opacity-60'
                  }`}
                >
                  <i className="fa-solid fa-comments text-lg"></i>
                  <span className="text-[9px] font-bold">Saran</span>
                </button>
                
                <button
                  onClick={() => setActiveTab('farm')}
                  className={`flex flex-col items-center gap-1 flex-1 py-1 transition-all ${
                    activeTab === 'farm' ? 'text-green-400 scale-105' : 'text-blue-200 opacity-60'
                  }`}
                >
                  <i className="fa-solid fa-seedling text-lg"></i>
                  <span className="text-[9px] font-bold">Kebun</span>
                </button>
                
                <button
                  onClick={() => setActiveTab('quiz')}
                  className={`flex flex-col items-center gap-1 flex-1 py-1 transition-all ${
                    activeTab === 'quiz' ? 'text-[#F4C542] scale-105' : 'text-blue-200 opacity-60'
                  }`}
                >
                  <i className="fa-solid fa-gamepad text-lg"></i>
                  <span className="text-[9px] font-bold">Quiz</span>
                </button>
                
                <button
                  onClick={handleLogout}
                  className="flex flex-col items-center gap-1 flex-1 py-1 text-red-400 opacity-60 hover:opacity-100"
                  title="Keluar"
                >
                  <i className="fa-solid fa-right-from-bracket text-lg"></i>
                  <span className="text-[9px] font-bold">Keluar</span>
                </button>
              </div>

              {/* Main Content Pane */}
              <main className="flex-1 p-4 md:p-10 lg:p-12 h-[calc(100vh-64px)] md:h-screen overflow-y-auto bg-gray-50">
                <div className="max-w-6xl mx-auto">
                  <header className="mb-6 hidden md:block">
                    <h2 className="text-3xl font-black text-gray-800 capitalize tracking-tight">
                      {activeTab === 'profil' ? 'Profil & Keamanan Akun' : activeTab === 'saran' ? 'Saran & Penilaian Kelas' : activeTab === 'quiz' ? 'Quiz Game Islami 🎮' : activeTab === 'farm' ? 'Kebun Qur\'an 🌾' : activeTab.replace('-', ' ')}
                    </h2>
                    <p className="text-gray-500 mt-1 font-bold text-sm">Sistem Manajemen Kelas Ngaji Digital</p>
                  </header>

                  {/* Render content based on current active tab */}
                  {activeTab === 'dashboard' && renderDashboard()}
                  {activeTab === 'hafalan' && renderHafalan()}
                  {activeTab === 'absensi' && renderAbsensi()}
                  {activeTab === 'kas' && renderKas()}
                  {activeTab === 'rapor' && renderRapor()}
                  {activeTab === 'quiz' && renderQuiz()}
                  {activeTab === 'farm' && renderFarm()}
                  {activeTab === 'saran' && renderSaran()}
                  {activeTab === 'profil' && renderProfilSaya()}
                </div>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
